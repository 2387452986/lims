user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  client_max_body_size 200m;
  log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  upstream lims_app { server app:8080; keepalive 32; }

  server {
    listen 80;
    return 308 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /api/auth/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://lims_app;
      include proxy_params;
    }

    location / {
      proxy_pass http://lims_app;
      include proxy_params;
    }

    location /monitoring/ {
      proxy_pass http://grafana:3000/;
      include proxy_params;
    }
  }
}

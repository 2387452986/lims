spring:
  application:
    name: lims
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lims}
    username: ${DB_USER:lims}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB
  jackson:
    time-zone: UTC

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    path: /api/openapi
    version: OPENAPI_3_0
  swagger-ui:
    path: /api/docs

lims:
  files:
    root: ${FILE_STORE_PATH:./var/files}
    max-size-bytes: 52428800
  security:
    bootstrap-admin-secret: ${BOOTSTRAP_ADMIN_SECRET:}
    recent-password-window: 5m
  reports:
    worker-id: ${REPORT_WORKER_ID:${HOSTNAME:local}-report-worker}
    chromium-executable: ${CHROMIUM_EXECUTABLE_PATH:}
  signing:
    encryption-key: ${SIGNING_ASSET_KEY:}
    require-assets: ${SIGNING_ASSET_REQUIRED:false}
  personnel:
    encryption-key: ${PERSONNEL_DATA_KEY:${SIGNING_ASSET_KEY:}}
  monitoring:
    tls-certificate: ${TLS_CERTIFICATE_PATH:}

logging:
  structured:
    format:
      console: ecs
